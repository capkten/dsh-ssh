name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The agent repair workflow re-dispatches CI after pushing to a Renovate PR.
  workflow_dispatch:

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  pack:
    name: publishable payload
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify the publishable tarball carries the compiled lib tree
        run: |
          npm pack --ignore-scripts
          node scripts/check-package.mjs dsh-ssh-*.tgz
