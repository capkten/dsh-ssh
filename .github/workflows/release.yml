name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Check tag and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json","utf8")); if(process.env.RELEASE_TAG!==`v${p.version}`) throw new Error("Tag/version mismatch")'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package and verify payload
        run: |
          npm pack --ignore-scripts
          node scripts/check-package.mjs dsh-ssh-*.tgz
          sha256sum dsh-ssh-*.tgz > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dsh-ssh-*.tgz SHA256SUMS.txt --verify-tag --prerelease --title "$RELEASE_TAG — SSH / Docker for DSH 0.2.2-rc.1" --notes-file RELEASE_NOTES.md
