# The dsh-ssh bundle patch: SSH remote development over the dsh-web-app layer.
#
# Rows here are overridden by the profile's own cordis.patch.yml and any
# --patch overlays, so a deployment can retune or disable any of them.
#
# - The aggregate `ssh-remote` row mounts the remote agent-preset controller
#   and makes the client bundle scannable. It does NOT publish `ctx.subprocess`
#   or `ctx.fs` into the host realm (those single-slot services belong to the
#   local providers); remote providers are mounted per session inside an
#   isolated preset, keyed by the registered connection (see src/preset.ts).
# - The host-local browse provider keeps directoryPickerController available.
#   Remote browsing uses /dsh-ssh without a host-level ssh service.
# - Set `host`/`username`/`cwd` on the aggregate row only for a manual
#   host-wide composition (that also requires disabling the local providers).

# 关闭默认 -auto picker（它动态挂载的界面随行一起消失）
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true

- insert:
    # 远程 agent preset 控制器（按连接注册隔离执行域，不占用 host 的 fs/subprocess 槽）
    - id: ssh-remote
      name: dsh-ssh

    # 本机/远程目录 browse 后端
    - id: directory-picker-ssh
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
      config:
        maxEntries: 1000

    # 多连接注册表 + /dsh-ssh RPC（持久化、连接管理、远程目录浏览）
    - id: ssh-web-channel
      name: dsh-ssh/web
      config:
        maxEntries: 1000
